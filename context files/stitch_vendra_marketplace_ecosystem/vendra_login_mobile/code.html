<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface p-container-margin md:p-0">
<div class="w-full max-w-[375px] mx-auto bg-transparent relative z-10 flex flex-col h-full md:h-auto md:min-h-[812px] justify-between">
<!-- Header Section -->
<header class="pt-2xl pb-xl text-center px-container-margin">
<div class="flex items-center justify-center gap-xs mb-sm">
<span class="font-h1 text-h1 text-primary">Vendra</span>
<!-- Abstract Flag Representation -->
<div aria-hidden="true" class="flex h-6 w-8 bg-tertiary rounded-sm overflow-hidden border border-outline-variant shadow-sm ml-2">
<div class="w-2/3 bg-tertiary"></div>
<div class="w-1/3 bg-surface-container-lowest"></div>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Pakistan's Leading Marketplace</p>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-container-margin flex flex-col">
<!-- Role Selector Tabs -->
<div class="flex bg-surface-container-low rounded-xl p-xs mb-lg shadow-sm border border-outline-variant/30">
<button class="flex-1 py-sm px-xs bg-surface-container-lowest text-primary font-label-md text-label-md rounded-lg shadow-sm text-center transition-all">Customer</button>
<button class="flex-1 py-sm px-xs text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors text-center">Vendor</button>
<button class="flex-1 py-sm px-xs text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors text-center">Rider</button>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-lg shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-outline-variant/20 flex-grow md:flex-grow-0">
<h1 class="font-h3 text-h3 text-on-surface mb-lg">Welcome Back</h1>
<form class="space-y-md">
<!-- Phone/Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="contact">Phone Number or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder:text-outline/70" id="contact" placeholder="03XX-XXXXXXX / email@example.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant block" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-surface-bright border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" id="password" placeholder="Enter your password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full mt-lg py-3 px-4 bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-lg shadow-sm hover:bg-secondary hover:text-on-secondary transition-colors flex items-center justify-center gap-2" type="submit">
                        Login
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-lg flex items-center">
<div class="flex-grow border-t border-outline-variant/40"></div>
<span class="flex-shrink-0 px-3 font-label-sm text-label-sm text-on-surface-variant bg-surface-container-lowest">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/40"></div>
</div>
<!-- Social Login Placeholder -->
<div class="flex gap-sm justify-center">
<button class="flex items-center justify-center w-12 h-12 rounded-full border border-outline-variant hover:bg-surface-container transition-colors">
<span class="font-bold text-on-surface">G</span>
</button>
<button class="flex items-center justify-center w-12 h-12 rounded-full border border-outline-variant hover:bg-surface-container transition-colors text-primary">
<span class="font-bold text-primary">f</span>
</button>
</div>
</div>
<!-- Signup Link -->
<div class="text-center mt-xl pb-xl">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:underline ml-1" href="#">Sign up now</a>
</p>
</div>
</main>
</div>
