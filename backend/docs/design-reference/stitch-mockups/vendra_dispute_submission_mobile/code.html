<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report an Issue - Vendra</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                        "background": "#f8f9ff",

                        "on-surface-variant": "#464651",

                        "tertiary-fixed": "#6bff8f",

                        "surface-container-low": "#eff4ff",
                        "primary": "#232774",
                        "primary-fixed": "#e1e0ff",
                        "on-tertiary-container": "#35d168",

                        "tertiary": "#003a16",
                        "outline": "#777682",
                        "on-surface": "#0b1c30",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "on-secondary-fixed-variant": "#783200",
                        "tertiary-container": "#005422",
                        "on-tertiary-fixed-variant": "#005321",
                        "on-primary-fixed": "#0a0b5f",
                        "error": "#ba1a1a",
                        "secondary-container": "#fd761a",
                        "on-primary": "#ffffff",
                        "primary-container": "#3b3f8c",
                        "on-tertiary-fixed": "#002109",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#213145",
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed": "#ffdbca",
                        "tertiary-fixed-dim": "#4ae176",
                        "on-background": "#0b1c30",
                        "on-secondary-container": "#5c2400",
                        "secondary-fixed-dim": "#ffb690",
                        "on-secondary-fixed": "#341100",
                        "surface-variant": "#d3e4fe",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "xs": "4px",
                        "container-margin": "20px",
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "lg": "24px",
                        "base": "8px",
                        "2xl": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "h2": ["Inter"],
                        "h1": ["Inter"],
                        "label-md": ["Inter"],

                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h2": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "h1": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "h3": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased md:hidden max-w-[375px] mx-auto min-h-screen relative flex flex-col">
<!-- TopAppBar Component (Transactional/Task-focused, so no BottomNavBar/SideNav) -->
<header class="bg-surface-container-lowest flex justify-between items-center w-full px-container-margin py-md sticky top-0 z-50 shadow-sm">
<button class="text-on-surface-variant hover:bg-surface-container-low p-sm rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 font-bold text-primary">Report an Issue</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Canvas -->
<main class="flex-grow flex flex-col px-container-margin py-lg space-y-lg pb-24">
<!-- Escrow Banner -->
<div class="bg-surface-container-highest rounded-lg p-md flex items-start gap-md shadow-sm border border-outline-variant/30">
<div class="bg-tertiary-container rounded-full p-xs flex-shrink-0 mt-xs">
<span class="material-symbols-outlined text-on-tertiary-container text-[18px]" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-xs">Payment Securely Held</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Your Rs.2,500 is safe in escrow until this dispute is resolved.</p>
</div>
</div>
<!-- Order Card Overview -->
<section>
<h2 class="font-label-md text-label-md text-on-surface-variant mb-sm px-xs">Order Details</h2>
<div class="bg-surface-container-lowest rounded-xl p-md shadow-sm border border-outline-variant/50 flex gap-md items-center">
<img alt="Super Kernel Basmati Rice bag" class="w-16 h-16 rounded-lg object-cover border border-outline-variant/20" data-alt="A clean, brightly lit, close-up photograph of a premium bag of white basmati rice, showing high-quality grains. The lighting is soft and natural, emphasizing the texture and purity of the rice against a clean white background. This image perfectly fits a high-fidelity, modern e-commerce mobile app interface representing Pakistani grocery products." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-u3zQMYSwoKkAik_KfOyyX9623PF5csrgGeHSisArk3wnvb-VtxEFpy88V0apPIVHBmXIveEwMtIUQuKKOTrX1dfODS4Pka-OwsQoc3M2auXUZYeMJBlAK7oRTPJ1Xgmu--S_gGgguUrqrmRoNEe6GKdyYflxER3GUhLMvdI42qUDSoKLCV-q4buckMqCwqwC8y1xnF69PcZGp2nMRRFRi4kATCVe46mArI-i3mx8u3T0mj0zBwQo7M9Acbpeq2aFYuiIyyXgsK0"/>
<div class="flex-1">
<p class="font-label-sm text-label-sm text-outline mb-xs">Fresh Mart Gujranwala</p>
<h3 class="font-body-md text-body-md text-on-surface font-medium leading-tight mb-xs">Super Kernel Basmati Rice 5kg</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Qty: 2 • Order #PK-84729</p>
</div>
</div>
</section>
<!-- Form Step 1 -->
<section class="flex-1 flex flex-col">
<div class="flex justify-between items-center mb-md px-xs">
<span class="font-label-md text-label-md text-primary">Step 1 of 2</span>
<span class="font-label-sm text-label-sm text-outline">Issue Details</span>
</div>
<div class="w-full bg-surface-container h-2 rounded-full mb-lg overflow-hidden">
<div class="bg-primary h-full rounded-full w-1/2"></div>
</div>
<div class="space-y-lg flex-1">
<!-- Issue Type Grid -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-sm px-xs">What went wrong?</label>
<div class="grid grid-cols-2 gap-sm">
<label class="cursor-pointer relative">
<input class="peer sr-only" name="issue_type" type="radio"/>
<div class="border border-outline-variant rounded-lg p-md text-center hover:bg-surface-container-low transition-colors peer-checked:border-primary peer-checked:bg-surface-container-low peer-checked:ring-1 peer-checked:ring-primary">
<span class="material-symbols-outlined text-outline peer-checked:text-primary mb-xs block" data-icon="package_2">package_2</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-primary">Not Received</span>
</div>
</label>
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="issue_type" type="radio"/>
<div class="border border-outline-variant rounded-lg p-md text-center hover:bg-surface-container-low transition-colors peer-checked:border-primary peer-checked:bg-surface-container-low peer-checked:ring-1 peer-checked:ring-primary">
<span class="material-symbols-outlined text-outline peer-checked:text-primary mb-xs block" data-icon="swap_horiz">swap_horiz</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-primary">Wrong Item</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="issue_type" type="radio"/>
<div class="border border-outline-variant rounded-lg p-md text-center hover:bg-surface-container-low transition-colors peer-checked:border-primary peer-checked:bg-surface-container-low peer-checked:ring-1 peer-checked:ring-primary">
<span class="material-symbols-outlined text-outline peer-checked:text-primary mb-xs block" data-icon="broken_image">broken_image</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-primary">Damaged</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="issue_type" type="radio"/>
<div class="border border-outline-variant rounded-lg p-md text-center hover:bg-surface-container-low transition-colors peer-checked:border-primary peer-checked:bg-surface-container-low peer-checked:ring-1 peer-checked:ring-primary">
<span class="material-symbols-outlined text-outline peer-checked:text-primary mb-xs block" data-icon="production_quantity_limits">production_quantity_limits</span>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-primary">Missing Parts</span>
</div>
</label>
</div>
</div>
<!-- Description -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-sm px-xs" for="description">Describe the issue</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-md font-body-sm text-body-sm text-on-surface placeholder-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" id="description" placeholder="E.g., I ordered Super Kernel Basmati but received regular broken rice instead..." rows="4"></textarea>
</div>
<!-- Photo Upload -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-sm px-xs">Attach Evidence (Optional)</label>
<div class="flex gap-sm overflow-x-auto pb-sm snap-x">
<!-- Upload Button Slot -->
<button class="flex-shrink-0 w-20 h-20 border-2 border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center text-outline hover:bg-surface-container-low hover:border-primary hover:text-primary transition-colors snap-start">
<span class="material-symbols-outlined mb-1" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-sm text-[10px]">Add Photo</span>
</button>
<!-- Empty Slots for visual cue -->
<div class="flex-shrink-0 w-20 h-20 border border-outline-variant/30 bg-surface-container-lowest rounded-lg snap-start"></div>
<div class="flex-shrink-0 w-20 h-20 border border-outline-variant/30 bg-surface-container-lowest rounded-lg snap-start"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Sticky Action -->
<div class="fixed bottom-0 w-full max-w-[375px] bg-surface-container-lowest border-t border-outline-variant/20 p-md z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full bg-secondary-container text-on-secondary-container font-label-md text-label-md py-md rounded-lg flex items-center justify-center gap-sm active:scale-95 transition-transform">
            Continue to Resolution
            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</body></html>
